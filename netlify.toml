[build]
  command = "npm ci && npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. API calls should use an absolute VITE_API_URL in production
# (Netlify cannot run the Express + Postgres Docker stack).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
