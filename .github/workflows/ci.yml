name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce?schema=public
      JWT_SECRET: ci-test-jwt-secret-16
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      CLIENT_URL: http://localhost:5173
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run db:generate
      - run: npm run build

  docker:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f server/Dockerfile -t ecommerce-api:${{ github.sha }} .
      - name: Build storefront image
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          docker build -f client/Dockerfile -t ecommerce-web:${{ github.sha }} \
            --build-arg VITE_API_URL="${VITE_API_URL:-/api}" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}" \
            --build-arg VITE_SITE_URL="${VITE_SITE_URL:-http://localhost}" \
            .

  deploy-netlify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Build storefront
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          export VITE_API_URL="${VITE_API_URL:-/api}"
          export VITE_STRIPE_PUBLISHABLE_KEY="${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}"
          export VITE_SITE_URL="${VITE_SITE_URL:-https://localhost}"
          npm run build -w client
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Add GitHub secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to publish the storefront."
            echo "Create a site at https://app.netlify.com/teams/yugshah82/projects then add those secrets."
            exit 0
          fi
          if [ ! -d "$GITHUB_WORKSPACE/netlify/functions" ]; then
            echo "API functions directory is missing."
            exit 1
          fi
          npx netlify-cli deploy --prod --no-build \
            --dir="$GITHUB_WORKSPACE/client/dist" \
            --functions="$GITHUB_WORKSPACE/netlify/functions" \
            --filter client \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "github ${GITHUB_SHA}"
          code=""
          for _ in 1 2 3 4 5 6; do
            code="$(curl -s -o /tmp/api-csrf.json -w "%{http_code}" https://ecommerce-cicd-yug0708.netlify.app/api/auth/csrf)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "Live API check failed with status $code"
            exit 1
          fi
